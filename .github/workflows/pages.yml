name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit
      - run: npm run audit:diagnosis:parallel
      - run: npm run audit:paths:parallel
      - name: Upload diagnosis audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-audit
          path: |
            outputs/diagnosis-audit/
            outputs/diagnostic-paths/
          retention-days: 14
      - run: npm run simulate:perfect
      - run: npm run simulate:mixed
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
