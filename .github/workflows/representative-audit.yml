name: Extended representative audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: diagnosis
            script: scripts/audit-diagnosis.mjs
          - kind: paths
            script: scripts/audit-diagnostic-paths.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node ${{ matrix.script }} --representatives --output outputs/representative-${{ matrix.kind }}
      - name: Upload representative audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representative-${{ matrix.kind }}
          path: outputs/representative-${{ matrix.kind }}/
          retention-days: 14
