name: Full diagnosis audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:diagnosis:parallel
      - run: npm run audit:paths:parallel
      - name: Upload full audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-audit
          path: |
            outputs/diagnosis-audit/
            outputs/diagnostic-paths/
          retention-days: 14
