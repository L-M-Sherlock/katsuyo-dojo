name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select audit scope
        id: scope
        run: node scripts/ci-audit-scope.mjs
      - run: npm test
      - run: npm run audit
      - name: Representative diagnosis audit
        if: steps.scope.outputs.diagnosis == 'true'
        run: node scripts/audit-diagnosis.mjs --representatives --output outputs/diagnosis-representatives
      - name: Representative path audit
        if: steps.scope.outputs.diagnosis == 'true'
        run: node scripts/audit-diagnostic-paths.mjs --representatives --output outputs/path-representatives
      - name: Upload representative audit
        if: always() && steps.scope.outputs.diagnosis == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: representative-audit
          path: |
            outputs/diagnosis-representatives/
            outputs/path-representatives/
          retention-days: 14
      - run: npm run simulate:perfect
      - run: npm run simulate:mixed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
