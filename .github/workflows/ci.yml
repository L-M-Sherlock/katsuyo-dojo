name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit
      - run: npm run audit:diagnosis:parallel
      - run: npm run audit:paths:parallel
      - name: Upload diagnosis audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-audit
          path: |
            outputs/diagnosis-audit/
            outputs/diagnostic-paths/
          retention-days: 14
      - run: npm run simulate:perfect
      - run: npm run simulate:mixed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
